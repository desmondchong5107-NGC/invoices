<script>
const SUPABASE_URL = "https://bzqgademvvtbpthqoxoj.supabase.co";
const SUPABASE_KEY = "sb_publishable_N_pH9VbgdNyXn_cAl48cVQ_p0WcR5L6";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  user:null, issuers:[], clients:[], invoices:[],
  currentInvoiceId:null,
  current:{issuer:null,client:null},
  historyPage:1,
  historyPageSize:8,
  items:[{desc:"Referral Fee for Client (Tay Xiu Wen/ VHX520)", amount:183.84}]
};

function today(){ return new Date().toISOString().slice(0,10); }
document.getElementById('date').value = today();

async function init(){
  const { data } = await sb.auth.getSession();
  state.user = data.session?.user || null;
  setLoggedIn(!!state.user);
  if(state.user) await refreshAll();
  render();
}
function setLoggedIn(yes){
  document.getElementById('loginBox').classList.toggle('hidden', yes);
  document.getElementById('appBox').classList.toggle('hidden', !yes);
  const st=document.getElementById('status');
  st.classList.toggle('hidden', !yes);
  st.textContent = yes ? "Logged in" : "";
}
async function login(){
  try{
    const email=val('loginEmail'), password=val('loginPassword');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    state.user=data.user; setLoggedIn(true); await refreshAll(); toast("Logged in");
  }catch(e){ toast(e.message); }
}
async function logout(){
  await sb.auth.signOut(); state.user=null; setLoggedIn(false); toast("Logged out");
}

async function refreshAll(){
  await Promise.all([loadIssuers(), loadClients(), loadInvoices()]);
  buildSelects(); buildBackendLists(); buildItems(); renderHistory(); render();
}
async function loadIssuers(){
  const { data, error } = await sb.from('invoice_issuers').select('*').order('created_at', {ascending:true});
  if(error) throwError(error); state.issuers=data||[];
  if(!state.current.issuer && state.issuers[0]) state.current.issuer=state.issuers[0].id;
}
async function loadClients(){
  const { data, error } = await sb.from('invoice_clients').select('*').order('created_at', {ascending:true});
  if(error) throwError(error); state.clients=data||[];
  if(!state.current.client && state.clients[0]) state.current.client=state.clients[0].id;
}
async function loadInvoices(){
  const { data, error } = await sb.from('invoice_records').select('*').order('created_at', {ascending:false}).limit(200);
  if(error) throwError(error); state.invoices=data||[];
}
function throwError(error){ console.error(error); toast(error.message || "Supabase error"); }

function switchTab(id){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  [...document.querySelectorAll('.tab')].find(b=>b.textContent.includes(id==='invoice'?'Invoice':id==='history'?'History':'Backend')).classList.add('active');
  document.getElementById(id).classList.add('active');
}
function buildSelects(){
  issuerSelect.innerHTML=state.issuers.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');
  clientSelect.innerHTML=state.clients.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');
  if(state.current.issuer) issuerSelect.value=state.current.issuer;
  if(state.current.client) clientSelect.value=state.current.client;
}
function buildItems(){
  lineItems.innerHTML = state.items.map((it,i)=>`
    <div class="card">
      <label>Description</label><input value="${escapeAttr(it.desc)}" oninput="state.items[${i}].desc=this.value; render();">
      <div class="row"><div><label>Amount RM</label><input type="number" step="0.01" value="${Number(it.amount||0).toFixed(2)}" oninput="state.items[${i}].amount=parseFloat(this.value||0); render();"></div>
      <div style="display:flex;align-items:end"><button class="danger" style="width:100%" onclick="removeItem(${i})">Remove</button></div></div>
    </div>`).join('');
}
function addItem(){ state.items.push({desc:"",amount:0}); buildItems(); render(); }
function removeItem(i){ state.items.splice(i,1); buildItems(); render(); }

async function saveIssuer(){
  try{
    const payload={name:val('bIssuerName'),address:val('bIssuerAddress'),phone:val('bIssuerPhone'),email:val('bIssuerEmail'),note:val('bIssuerNote'),signature:val('bIssuerSig')};
    const id=val('bIssuerId');
    let q = id ? sb.from('invoice_issuers').update(payload).eq('id', id).select().single() : sb.from('invoice_issuers').insert(payload).select().single();
    const { data, error } = await q; if(error) throw error;
    state.current.issuer=data.id; await loadIssuers(); buildSelects(); buildBackendLists(); render(); toast("Issuer saved");
  }catch(e){ toast(e.message); }
}
async function saveClient(){
  try{
    const payload={name:val('bClientName'),address:val('bClientAddress'),attn:val('bClientAttn'),tel:val('bClientTel')};
    const id=val('bClientId');
    let q = id ? sb.from('invoice_clients').update(payload).eq('id', id).select().single() : sb.from('invoice_clients').insert(payload).select().single();
    const { data, error } = await q; if(error) throw error;
    state.current.client=data.id; await loadClients(); buildSelects(); buildBackendLists(); render(); toast("Client saved");
  }catch(e){ toast(e.message); }
}
function buildBackendLists(){
  issuerList.innerHTML=state.issuers.map(x=>`<div class="listItem"><div><b>${escapeHtml(x.name)}</b><br><span>${escapeHtml(x.email||'')}</span></div><button class="smallbtn" onclick="editIssuer('${x.id}')">Edit</button></div>`).join('');
  clientList.innerHTML=state.clients.map(x=>`<div class="listItem"><div><b>${escapeHtml(x.name)}</b><br><span>${escapeHtml(x.attn||'')}</span></div><button class="smallbtn" onclick="editClient('${x.id}')">Edit</button></div>`).join('');
}
function editIssuer(id){
  const x=state.issuers.find(a=>a.id===id); if(!x) return;
  set('bIssuerId',x.id); set('bIssuerName',x.name); set('bIssuerAddress',x.address); set('bIssuerPhone',x.phone); set('bIssuerEmail',x.email); set('bIssuerNote',x.note); set('bIssuerSig',x.signature);
}
function editClient(id){
  const x=state.clients.find(a=>a.id===id); if(!x) return;
  set('bClientId',x.id); set('bClientName',x.name); set('bClientAddress',x.address); set('bClientAttn',x.attn); set('bClientTel',x.tel);
}
function clearIssuerForm(){ ['bIssuerId','bIssuerName','bIssuerAddress','bIssuerPhone','bIssuerEmail','bIssuerNote','bIssuerSig'].forEach(id=>set(id,'')); }
function clearClientForm(){ ['bClientId','bClientName','bClientAddress','bClientAttn','bClientTel'].forEach(id=>set(id,'')); }

function snapshot(){
  const issuer=state.issuers.find(x=>x.id===issuerSelect.value)||{};
  const client=state.clients.find(x=>x.id===clientSelect.value)||{};
  const total=state.items.reduce((s,it)=>s+(parseFloat(it.amount)||0),0);
  return {
    invoice_no:val('invoiceNo'), invoice_date:val('date'), issuer_id:issuer.id, client_id:client.id,
    your_ref:val('yourRef'), do_no:val('doNo'), terms:val('terms'), page_no:val('pageNo'), total,
    issuer, client, items:JSON.parse(JSON.stringify(state.items))
  };
}
async function saveInvoice(){
  try{
    const snap=snapshot();
    if(!snap.issuer_id || !snap.client_id) return toast("Save issuer and client first");
    if(!snap.invoice_no) return toast("Invoice no required");

    const payload={invoice_no:snap.invoice_no, invoice_date:snap.invoice_date, issuer_id:snap.issuer_id, client_id:snap.client_id, your_ref:snap.your_ref, do_no:snap.do_no, terms:snap.terms, page_no:snap.page_no, total:snap.total, snapshot:snap};

    let invoiceId = state.currentInvoiceId;
    let shouldUpdateExisting = false;

    if(invoiceId){
      const existing = state.invoices.find(x => x.id === invoiceId);
      shouldUpdateExisting = existing && String(existing.invoice_no || "") === String(snap.invoice_no || "");
    }

    if(shouldUpdateExisting){
      const { error } = await sb.from('invoice_records').update(payload).eq('id', invoiceId);
      if(error) throw error;
      await sb.from('invoice_items').delete().eq('invoice_id', invoiceId);
    }else{
      const { data, error } = await sb.from('invoice_records').insert(payload).select().single();
      if(error) throw error;
      invoiceId = data.id;
      state.currentInvoiceId = invoiceId;
    }

    const rows=state.items.map((it,i)=>({invoice_id:invoiceId,line_no:i+1,description:it.desc,amount:parseFloat(it.amount)||0}));
    if(rows.length){
      const { error: itemErr } = await sb.from('invoice_items').insert(rows);
      if(itemErr) throw itemErr;
    }

    await loadInvoices(); renderHistory(); toast(shouldUpdateExisting ? "Invoice updated" : "New invoice saved");
  }catch(e){ toast(e.message); }
}
function renderHistory(){
  const q=(val('historySearch')||'').toLowerCase();
  let arr=state.invoices.filter(x=>{
    const snap=x.snapshot||{};
    return !q || String(x.invoice_no||'').toLowerCase().includes(q) || String(snap.client?.name||'').toLowerCase().includes(q);
  });

  const totalPages = Math.max(1, Math.ceil(arr.length / state.historyPageSize));
  if(state.historyPage > totalPages) state.historyPage = totalPages;
  if(state.historyPage < 1) state.historyPage = 1;

  const start = (state.historyPage - 1) * state.historyPageSize;
  const pageItems = arr.slice(start, start + state.historyPageSize);

  historyList.innerHTML=pageItems.map(x=>{
    const snap=x.snapshot||{};
    return `<div class="history-card">
      <div class="history-head">
        <div>
          <div class="history-no">${escapeHtml(x.invoice_no)}</div>
          <div class="history-client">${escapeHtml(snap.client?.name||'')}</div>
        </div>
        <div class="history-total">
          <strong>RM ${money(x.total)}</strong>
          <span>${escapeHtml(x.invoice_date||'')}</span>
        </div>
      </div>
      <div class="history-actions">
        <button class="smallbtn" onclick="loadInvoice('${x.id}')">Load</button>
        <button class="smallbtn" onclick="duplicateInvoice('${x.id}')">Duplicate</button>
        <button class="smallbtn" onclick="deleteInvoice('${x.id}')">Delete</button>
      </div>
    </div>`;
  }).join('') || '<p class="muted">No saved invoices yet.</p>';

  const pageInfo = document.getElementById('historyPageInfo');
  const prevBtn = document.getElementById('historyPrevBtn');
  const nextBtn = document.getElementById('historyNextBtn');

  if(pageInfo){
    const totalItems = arr.length;
    const shownFrom = totalItems ? start + 1 : 0;
    const shownTo = Math.min(start + pageItems.length, totalItems);
    pageInfo.textContent = `Page ${state.historyPage} / ${totalPages} · ${shownFrom}-${shownTo} of ${totalItems}`;
  }
  if(prevBtn) prevBtn.disabled = state.historyPage <= 1;
  if(nextBtn) nextBtn.disabled = state.historyPage >= totalPages;
}

function changeHistoryPage(delta){
  state.historyPage += delta;
  renderHistory();
}
function loadInvoice(id){
  const x=state.invoices.find(a=>a.id===id); if(!x) return;
  const s=x.snapshot||{};
  state.currentInvoiceId=x.id;
  state.current.issuer=s.issuer_id; state.current.client=s.client_id;
  buildSelects();
  set('invoiceNo',s.invoice_no); set('date',s.invoice_date); set('yourRef',s.your_ref); set('doNo',s.do_no); set('terms',s.terms); set('pageNo',s.page_no);
  state.items=s.items||[]; buildItems(); render(); switchTab('invoice'); toast("Loaded for reprint");
}
function duplicateInvoice(id){
  loadInvoice(id); state.currentInvoiceId=null; set('invoiceNo', val('invoiceNo') + "-COPY"); render(); toast("Duplicated. Change invoice no.");
}
async function deleteInvoice(id){
  const ok = await openConfirm("Delete this saved invoice?", "Delete Invoice");
  if(!ok) return;
  const { error } = await sb.from('invoice_records').delete().eq('id',id); if(error) return toast(error.message);
  if(state.currentInvoiceId===id) state.currentInvoiceId=null;
  await loadInvoices(); renderHistory(); toast("Deleted");
}
function newInvoice(){
  state.currentInvoiceId=null; set('invoiceNo',''); set('date',today()); set('yourRef',''); set('doNo',''); set('terms','C.O.D'); set('pageNo','1 of 1');
  state.items=[{desc:"",amount:0}]; buildItems(); render(); toast("New invoice");
}

function render(){
  state.current.issuer=issuerSelect?.value||state.current.issuer;
  state.current.client=clientSelect?.value||state.current.client;
  const issuer=state.issuers.find(x=>x.id===state.current.issuer)||{};
  const client=state.clients.find(x=>x.id===state.current.client)||{};
  companyBlock.innerHTML = `${escapeHtml(issuer.name||'')}<br>${escapeHtml(issuer.address||'')}<br>Phone: ${escapeHtml(issuer.phone||'')} Email: ${escapeHtml(issuer.email||'')}`;
  invoiceTitle.textContent = `INVOICE : ${val('invoiceNo')}`;
  clientBlock.innerHTML = `<div class="client-name">${escapeHtml(client.name||'')}</div><div class="client-address">${nl(client.address||'')}</div><div class="contact-box"><div class="contact-attn">Attn : ${escapeHtml(client.attn||'')}</div><div class="contact-line">TEL : ${escapeHtml(client.tel||'')}</div></div>`;
  metaBlock.innerHTML = [["Your Ref.",val('yourRef')],["Our D/O No",val('doNo')],["Terms",val('terms')],["Date",formatDate(val('date'))],["Page",val('pageNo')]].map(r=>`<div class="meta-row"><b>${r[0]}</b><b>:</b><b>${escapeHtml(r[1])}</b></div>`).join('');
  itemsBody.innerHTML = state.items.map((it,i)=>`<tr><td class="no">${i+1}</td><td class="desc">${escapeHtml(it.desc)}</td><td class="amount">${money(it.amount)}</td></tr>`).join('');
  const total=state.items.reduce((s,it)=>s+(parseFloat(it.amount)||0),0);
  amountWords.textContent = `RINGGIT MALAYSIA : ${amountToWords(total).toUpperCase()} ONLY`;
  totalAmount.textContent = money(total);
  notesBlock.innerHTML = `<div>Notes :</div><div>1. ${nl(issuer.note||'')}</div>`;
  signatureName.textContent = issuer.signature||'';
}

function val(id){return document.getElementById(id)?.value || ""}
function set(id,v){const el=document.getElementById(id); if(el) el.value=v||""}
function escapeHtml(str){return String(str||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escapeAttr(str){return escapeHtml(str).replace(/"/g,'&quot;')}
function nl(str){return escapeHtml(str).replace(/\n/g,'<br>')}
function formatDate(s){if(!s)return"";const d=new Date(s+"T00:00:00");return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
function money(n){return (parseFloat(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
const ones=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const tens=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function wordsUnder1000(n){let out=[];if(n>=100){out.push(ones[Math.floor(n/100)]+" hundred");n%=100}if(n>=20){out.push(tens[Math.floor(n/10)]);n%=10}if(n>0)out.push(ones[n]);return out.join(" ")}
function numWords(n){if(n===0)return"zero";let parts=[];for(const [v,name] of [[1000000,"million"],[1000,"thousand"]]){if(n>=v){parts.push(wordsUnder1000(Math.floor(n/v))+" "+name);n%=v}}if(n>0)parts.push(wordsUnder1000(n));return parts.join(" ")}
function amountToWords(amount){const r=Math.floor(amount);const c=Math.round((amount-r)*100);let text=numWords(r);if(c>0)text+=" and cents "+numWords(c);return text}
function toast(msg="Saved"){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}


let confirmResolver = null;

function openConfirm(message, title="Confirm"){
  const modal = document.getElementById('confirmModal');
  const titleEl = document.getElementById('confirmModalTitle');
  const msgEl = document.getElementById('confirmModalMessage');
  titleEl.textContent = title;
  msgEl.textContent = message;
  modal.classList.add('show');
  return new Promise(resolve => {
    confirmResolver = resolve;
  });
}

function closeConfirm(result){
  const modal = document.getElementById('confirmModal');
  modal.classList.remove('show');
  if(confirmResolver){
    confirmResolver(result);
    confirmResolver = null;
  }
}

init();
</script>
