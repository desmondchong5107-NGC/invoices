<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#070b12;
      --bg-soft:#0f1726;
      --panel:rgba(16,24,39,.58);
      --panel-strong:rgba(14,20,32,.82);
      --line:rgba(255,255,255,.11);
      --line-strong:rgba(255,255,255,.18);
      --ink:#f8fafc;
      --muted:#9aa7b8;
      --gold:#d4af67;
      --gold-soft:#f0deb0;
      --danger:#fca5a5;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(212,175,103,.13), transparent 26%),
        radial-gradient(circle at 92% 0%, rgba(59,130,246,.08), transparent 22%),
        radial-gradient(circle at 80% 88%, rgba(168,85,247,.06), transparent 24%),
        linear-gradient(180deg,#0d121b 0%, #080c13 44%, #05070b 100%);
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 16%, transparent 84%, rgba(255,255,255,.02));
    }
    .app{display:grid;grid-template-columns:420px minmax(0,1fr);min-height:100vh;position:relative;z-index:1}
    aside{
      position:sticky;top:0;height:100vh;overflow:auto;
      padding:24px;
      border-right:1px solid rgba(255,255,255,.06);
      background:linear-gradient(180deg, rgba(7,10,16,.82), rgba(10,15,23,.7));
      backdrop-filter:blur(24px) saturate(130%);
      box-shadow:inset -1px 0 0 rgba(255,255,255,.04), 24px 0 60px rgba(0,0,0,.22);
    }
    aside::-webkit-scrollbar{width:10px}
    aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:999px}
    main{padding:24px;overflow:auto;position:relative;display:flex;justify-content:center}
    .brand-panel{
      display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:12px;
      margin-bottom:16px;padding:16px 16px;
      border:1px solid rgba(212,175,103,.14);
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      box-shadow:0 16px 34px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter:blur(20px);
    }
    .brand-lockup{display:flex;align-items:center;gap:14px;width:100%}
    .brand-mark{
      width:52px;height:52px;border-radius:16px;
      display:grid;place-items:center;
      overflow:hidden;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 10px 22px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.04);
      flex:0 0 auto;
    }
    .brand-mark img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .brand-text{display:flex;flex-direction:column;gap:4px}
    .brand-kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}
    .brand-name{font-size:14px;font-weight:650;color:#eef2f7;letter-spacing:.01em}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      border-radius:999px;padding:6px 10px;
      background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.16);
      color:#a7f3d0;font-size:11px;font-weight:800;
      width:auto;max-width:none;white-space:nowrap;
    }
    .pill:before{content:"";width:8px;height:8px;border-radius:999px;background:#34d399;box-shadow:0 0 12px rgba(52,211,153,.55)}
    .hidden{display:none!important}
    .glass-card,
    .card{
      border:1px solid rgba(255,255,255,.07);
      border-radius:22px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025));
      box-shadow:0 14px 30px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.03);
      backdrop-filter:blur(18px) saturate(140%);
    }
    .card{padding:16px;margin:12px 0}
    .hero-card{padding:18px}
    .toolbar-card{padding:10px 12px;margin:0 0 16px}
    .tabs{
      display:flex;gap:6px;padding:6px;margin:16px 0 18px;
      border-radius:18px;border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.05);
      backdrop-filter:blur(16px);
    }
    .tab{
      flex:1;border:0;border-radius:14px;padding:12px 10px;background:transparent;cursor:pointer;
      font-weight:800;font-size:13px;letter-spacing:.02em;color:#b7c0cd;
      transition:all .18s ease;
    }
    .tab:hover{color:#fff;background:rgba(255,255,255,.04)}
    .tab.active{
      color:#161616;
      background:linear-gradient(180deg,var(--gold-soft),var(--gold));
      box-shadow:0 10px 26px rgba(212,175,103,.18), inset 0 1px 0 rgba(255,255,255,.45);
    }
    .section{display:none}
    .section.active{display:block}
    .section-title{margin:4px 0 6px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft)}
    label{display:block;margin:12px 0 6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#d7deea}
    input,textarea,select{
      width:100%;padding:12px 13px;
      border:1px solid rgba(255,255,255,.06);border-radius:15px;
      background:linear-gradient(180deg, rgba(6,10,18,.66), rgba(11,16,26,.86));
      color:#fff;font-size:14px;outline:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
    }
    textarea{min-height:82px;resize:vertical}
    input::placeholder,textarea::placeholder{color:#778397}
    input:focus,textarea:focus,select:focus{
      border-color:rgba(212,175,103,.52);
      box-shadow:0 0 0 3px rgba(212,175,103,.12), inset 0 1px 0 rgba(255,255,255,.03);
    }
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button.primary,button.secondary,button.danger,.smallbtn{
      cursor:pointer;font-weight:800;transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    button.primary:hover,button.secondary:hover,button.danger:hover,.smallbtn:hover{transform:translateY(-1px)}
    button.primary,button.secondary,button.danger{border:0;border-radius:16px;padding:12px 15px}
    button.primary{
      color:#171717;background:linear-gradient(180deg,var(--gold-soft),var(--gold));
      box-shadow:0 10px 22px rgba(212,175,103,.18), inset 0 1px 0 rgba(255,255,255,.4);
    }
    button.secondary{
      color:#fff;border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      box-shadow:0 10px 24px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.03);
    }
    button.danger{
      color:#fecaca;border:1px solid rgba(248,113,113,.16);
      background:linear-gradient(180deg, rgba(239,68,68,.14), rgba(239,68,68,.08));
    }
    .smallbtn{
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      color:#fff;border-radius:12px;padding:8px 11px;font-size:12px;
    }
    .listItem{
      border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:12px;margin:10px 0;
      background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.03));
      display:flex;justify-content:space-between;gap:10px;align-items:center;
      box-shadow:0 12px 28px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.035);
    }
    .listItem b{font-size:13px;color:#fff}
    .listItem span{font-size:12px;color:#a9b4c3}
    .muted{color:#a3aebb;font-size:12px;line-height:1.5}
    .preview-wrap{
      display:flex;justify-content:center;align-items:flex-start;
      min-height:calc(100vh - 48px);
      width:min(880px, 100%);
      margin:0 auto;
      padding:22px 18px 26px;
      border-radius:30px;
      background:linear-gradient(180deg, rgba(255,255,255,.018), rgba(255,255,255,.008));
      border:1px solid rgba(255,255,255,.035);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.018);
      position:relative;
      overflow:hidden;
    }
    .preview-wrap:before{
      content:"";position:absolute;inset:auto 12% 6% 12%;height:160px;pointer-events:none;
      background:radial-gradient(circle, rgba(212,175,103,.16), transparent 60%);
      filter:blur(28px);
    }
    .preview-wrap:after{
      content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:70%;height:140px;pointer-events:none;
      background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
      filter:blur(18px);
    }
    /* Output area intentionally preserved */
    .paper{width:794px;min-height:1123px;background:#fff;padding:72px 66px 54px;box-shadow:0 28px 90px rgba(0,0,0,.42);font-family:"Times New Roman",Times,serif;position:relative;color:#000;z-index:1;transform:scale(.82);transform-origin:top center;margin-bottom:-205px}
    .company{text-align:center;font-weight:bold;font-size:15px;line-height:1.12;letter-spacing:.15px;text-transform:uppercase;margin-bottom:16px}
    .topline{border-top:3px solid #000;margin:0 0 8px}
    .invoice-no{text-align:right;font-size:12px;font-weight:bold;margin:0 0 8px}
    .bill-row{display:grid;grid-template-columns:1.05fr .95fr;gap:78px;align-items:start;margin-top:2px}
    .address-box{font-size:12px;line-height:1.18;min-height:116px;padding:2px 4px 0 0}
    .client-name{display:block;font-weight:bold;margin-bottom:4px;line-height:1.05}
    .client-address{margin-top:2px}
    .contact-box{margin-top:18px;padding:0;font-weight:bold;width:100%;min-height:auto}
    .contact-attn{margin-bottom:6px}
    .contact-line{display:block;white-space:nowrap}
    .meta{font-size:12px;line-height:1.45;padding-top:18px}
    .meta-row{display:grid;grid-template-columns:95px 8px 1fr;gap:3px}
    .items{margin-top:12px;border-top:3px solid #000;font-size:11px;width:100%;border-collapse:collapse;table-layout:fixed}
    .items thead th{border-bottom:1.5px solid #000;font-weight:bold;padding:2px 4px 1px}
    .items thead th:first-child{text-align:left;padding-left:24px}
    .items thead th:last-child{text-align:right}
    .items td{vertical-align:top;padding:3px 4px}
    .items td.no{width:20px;text-align:right;padding-right:5px}
    .items td.desc{font-weight:bold}
    .items td.amount{text-align:right;font-weight:bold}
    .bottom{position:absolute;left:66px;right:66px;bottom:78px;font-size:10px}
    .total-row{border-top:3px solid #000;display:grid;grid-template-columns:1fr 190px;align-items:start;padding-top:2px;min-height:18px}
    .words{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .total-box{display:grid;grid-template-columns:1fr 76px;align-items:center;gap:4px;font-weight:bold;text-align:right}
    .total-amount{border:3px solid #000;padding:0 4px;height:16px;line-height:12px;font-size:11px}
    .notes{margin-top:30px;font-weight:bold;line-height:1.25;width:360px}
    .signature{margin-top:52px;width:160px;text-align:center;font-weight:bold;font-size:11px}
    .sig-name{font-family:"Brush Script MT","Segoe Script",cursive;font-size:20px;transform:rotate(-5deg);line-height:.85;margin-bottom:2px}
    .sig-line{border-top:3px solid #000;padding-top:2px}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#0f1726,#0a101c);color:#fff;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;font-size:13px;z-index:50;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 34px rgba(0,0,0,.28)}
    .toast.show{opacity:1}
    
    .ghost-btn{
      color:#d9e1ec;
      border:1px solid rgba(255,255,255,.06);
      background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.025));
      box-shadow:none;
    }
    .ghost-btn:hover{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03))}
    .btns.actions-main .secondary{background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.04))}
    .btns.actions-main .ghost-btn{opacity:.92}
    .toolbar-actions{display:flex;gap:10px;flex-wrap:wrap}
    .history-card{
      border:1px solid rgba(255,255,255,.07);
      border-radius:20px;
      padding:14px 14px 12px;
      margin:12px 0;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025));
      box-shadow:0 14px 30px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.03);
    }
    .history-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:10px;
    }
    .history-no{
      font-size:14px;
      font-weight:800;
      color:#fff;
      line-height:1.2;
      margin-bottom:4px;
    }
    .history-client{
      font-size:12px;
      color:#aeb8c7;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:230px;
    }
    .history-total{
      text-align:right;
      flex:0 0 auto;
    }
    .history-total strong{
      display:block;
      font-size:15px;
      color:#fff;
      letter-spacing:.01em;
    }
    .history-total span{
      display:block;
      font-size:11px;
      color:#96a2b3;
      margin-top:3px;
    }
    .history-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .history-actions .smallbtn:last-child{
      color:#fecaca;
      border-color:rgba(248,113,113,.12);
      background:linear-gradient(180deg, rgba(239,68,68,.12), rgba(239,68,68,.06));
    }

    
    .smallbtn:disabled{
      opacity:.38;
      cursor:not-allowed;
      transform:none!important;
    }
    .history-panel{
      padding:14px 14px 12px;
    }
    .history-scroll{
      margin-top:12px;
      max-height:520px;
      overflow-y:auto;
      padding-right:6px;
    }
    .history-scroll::-webkit-scrollbar{
      width:8px;
    }
    .history-scroll::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.10);
      border-radius:999px;
    }
    .history-pagination{
      margin-top:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    
    .history-scroll{
      overflow-x:hidden;
    }
    .history-card{
      overflow:hidden;
    }
    .history-head{
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      align-items:start;
      column-gap:12px;
    }
    .history-head > div:first-child{
      min-width:0;
    }
    .history-client{
      max-width:none;
      width:100%;
    }
    .history-total{
      min-width:86px;
      text-align:right;
    }
    .history-total strong{
      font-size:14px;
      white-space:nowrap;
    }
    .history-actions{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:8px;
      width:100%;
    }
    .history-actions .smallbtn{
      width:100%;
      min-width:0;
      padding-left:6px;
      padding-right:6px;
      text-align:center;
    }

    
    .modal-overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(2,6,14,.58);
      backdrop-filter:blur(6px);
      z-index:9999;
      padding:24px;
    }
    .modal-overlay.show{
      display:flex;
    }
    .modal-card{
      width:min(440px, calc(100vw - 32px));
      border-radius:24px;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg, rgba(18,24,36,.94), rgba(12,17,27,.96));
      box-shadow:0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
      padding:22px 22px 18px;
      color:#fff;
    }
    .modal-title{
      font-size:22px;
      font-weight:800;
      letter-spacing:-.02em;
      margin-bottom:8px;
    }
    .modal-message{
      font-size:14px;
      color:#b9c4d3;
      line-height:1.55;
      margin-bottom:18px;
    }
    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }

    @media(max-width:1100px){
      .app{grid-template-columns:1fr}
      aside{height:auto;position:relative;border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}
      main{padding:18px;display:block}
      .preview-wrap{min-height:auto;width:100%}
      .paper{transform-origin:top center;transform:scale(.74);margin-bottom:-285px}
    }
    @page{size:A4 portrait;margin:0}
    @media print{
      body{background:white}
      .app{display:block}
      aside{display:none}
      main{padding:0;background:#fff}
      .preview-wrap{display:block;padding:0;background:none;border:0;box-shadow:none}
      .preview-wrap:before,.preview-wrap:after{display:none}
      .paper{width:210mm;height:297mm;min-height:297mm;box-shadow:none;margin:0;padding:19mm 17.5mm 14mm;transform:none!important}
      .bottom{left:17.5mm;right:17.5mm;bottom:20.5mm}
    }
  </style>
</head>

    <div id="loginBox" class="card hero-card">
      <label>Email</label><input id="loginEmail" type="email" placeholder="your@email.com">
      <label>Password</label><input id="loginPassword" type="password" placeholder="Supabase Auth password">
      <div class="btns">
        <button class="primary" onclick="login()">Login</button>
      </div>
    </div>

    <div id="appBox" class="hidden">
      <div class="card toolbar-card"><div class="toolbar-actions">
        <button class="secondary ghost-btn" onclick="logout()">Logout</button>
        <button class="secondary ghost-btn" onclick="refreshAll()">Refresh Cloud</button>
      </div></div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('invoice')">Invoice</button>
        <button class="tab" onclick="switchTab('history')">History</button>
        <button class="tab" onclick="switchTab('backend')">Backend</button>
      </div>

      <section id="invoice" class="section active">
        <div class="section-title">Invoice</div>
        <div class="card">
          <label>Issuer</label><select id="issuerSelect" onchange="render()"></select>
          <label>Bill To</label><select id="clientSelect" onchange="render()"></select>
          <div class="row"><div><label>Invoice No.</label><input id="invoiceNo" oninput="render()" value="IV26/05-0001"></div><div><label>Date</label><input id="date" type="date" oninput="render()"></div></div>
          <div class="row"><div><label>Your Ref.</label><input id="yourRef" oninput="render()"></div><div><label>Terms</label><input id="terms" oninput="render()" value="C.O.D"></div></div>
          <div class="row"><div><label>Our D/O No</label><input id="doNo" oninput="render()"></div><div><label>Page</label><input id="pageNo" oninput="render()" value="1 of 1"></div></div>
        </div>

        <div id="lineItems"></div>
        <div class="btns actions-main">
          <button class="secondary ghost-btn" onclick="addItem()">+ Add Item</button>
          <button class="primary" onclick="saveInvoice()">Save to Cloud</button>
          <button class="secondary" onclick="window.print()">Print / Save PDF</button>
          <button class="secondary ghost-btn" onclick="newInvoice()">New Invoice</button>
        </div>
      </section>

      <section id="history" class="section">
        <div class="section-title">Invoice History</div>
        <div class="card history-panel">
          <label>Search Invoice No / Client</label>
          <input id="historySearch" oninput="state.historyPage=1; renderHistory()" placeholder="Search...">
          <div class="history-scroll">
            <div id="historyList"></div>
          </div>
          <div class="history-pagination">
            <button class="smallbtn" id="historyPrevBtn" onclick="changeHistoryPage(-1)">Prev</button>
            <div id="historyPageInfo" class="muted"></div>
            <button class="smallbtn" id="historyNextBtn" onclick="changeHistoryPage(1)">Next</button>
          </div>
        </div>
      </section>

        <div class="section-title">Backend</div>
        <div class="card">

          <input type="hidden" id="bIssuerId">
          <label>Issuer Name</label><input id="bIssuerName" value="NEXT GEN CAPITAL SDN. BHD. (1457410-W)">
          <label>Address</label><input id="bIssuerAddress" value="NO 4, JALAN PEE KANG HAI, KAMPUNG ABDULLAH 85000, SEGAMAT JOHOR.">
          <div class="row"><div><label>Phone</label><input id="bIssuerPhone" value="017-238 6321"></div><div><label>Email</label><input id="bIssuerEmail" value="admin@nextgen-c.com"></div></div>
          <label>Bank / Cheque Note</label><textarea id="bIssuerNote">All cheques should be crossed and made payable to
NEXT GEN CAPITAL SDN. BHD. PBB 3229212909</textarea>
          <label>Signature Name</label><input id="bIssuerSig" value="Desmond">
          <div class="btns"><button class="primary" onclick="saveIssuer()">Save Issuer to Cloud</button><button class="secondary" onclick="clearIssuerForm()">Clear</button></div>

        <div class="card">
          <h3 style="margin:0 0 8px;font-size:15px">Client Backend</h3>
          <input type="hidden" id="bClientId">
          <label>Client / Company Name</label><input id="bClientName" value="CTC RISKS MANAGEMENT (M) SDN BHD">
          <label>Address</label><textarea id="bClientAddress">NO 20-2, 22-2, JALAN JASMIN 1/KS6,
41200 BANDAR BOTANIC, KLANG,
SELANGOR.</textarea>
          <div class="row"><div><label>Attention</label><input id="bClientAttn" value="MR. ENRIQUE LIM"></div><div><label>Telephone</label><input id="bClientTel" value="03-3324 2228"></div></div>
          <div class="btns"><button class="primary" onclick="saveClient()">Save Client to Cloud</button><button class="secondary" onclick="clearClientForm()">Clear</button></div>
        </div>
        <div id="clientList"></div>
      </section>
    </div>
  </aside>

  <main>
    <div class="preview-wrap">
      <div class="paper" id="paper">
        <div class="company" id="companyBlock"></div><div class="topline"></div><div class="invoice-no" id="invoiceTitle"></div>
        <div class="bill-row"><div class="address-box" id="clientBlock"></div><div class="meta" id="metaBlock"></div></div>
        <table class="items"><colgroup><col style="width:22px"><col><col style="width:92px"></colgroup><thead><tr><th colspan="2">Description</th><th>Amount</th></tr></thead><tbody id="itemsBody"></tbody></table>
        <div class="bottom"><div class="total-row"><div class="words" id="amountWords"></div><div class="total-box"><span>Total (RM)</span><span class="total-amount" id="totalAmount"></span></div></div><div class="notes" id="notesBlock"></div><div class="signature"><div class="sig-name" id="signatureName"></div><div class="sig-line">Authorised Signature</div></div></div>
      </div>
    </div>
  </main>
</div>
<div class="modal-overlay" id="confirmModal">
  <div class="modal-card">
    <div class="modal-title" id="confirmModalTitle">Confirm</div>
    <div class="modal-message" id="confirmModalMessage">Are you sure?</div>
    <div class="modal-actions">
      <button class="secondary ghost-btn" type="button" onclick="closeConfirm(false)">Cancel</button>
      <button class="primary" type="button" onclick="closeConfirm(true)">OK</button>
    </div>
  </div>
</div>
<div class="toast" id="toast">Saved</div>

<script>
const SUPABASE_URL = "https://bzqgademvvtbpthqoxoj.supabase.co";
const SUPABASE_KEY = "sb_publishable_N_pH9VbgdNyXn_cAl48cVQ_p0WcR5L6";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  user:null, issuers:[], clients:[], invoices:[],
  currentInvoiceId:null,
  current:{issuer:null,client:null},
  historyPage:1,
  historyPageSize:8,
  items:[{desc:"Referral Fee for Client (Tay Xiu Wen/ VHX520)", amount:183.84}]
};

function today(){ return new Date().toISOString().slice(0,10); }
document.getElementById('date').value = today();

async function init(){
  const { data } = await sb.auth.getSession();
  state.user = data.session?.user || null;
  setLoggedIn(!!state.user);
  if(state.user) await refreshAll();
  render();
}
function setLoggedIn(yes){
  document.getElementById('loginBox').classList.toggle('hidden', yes);
  document.getElementById('appBox').classList.toggle('hidden', !yes);
  const st=document.getElementById('status');
  st.classList.toggle('hidden', !yes);
  st.textContent = yes ? "Logged in" : "";
}
async function login(){
  try{
    const email=val('loginEmail'), password=val('loginPassword');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    state.user=data.user; setLoggedIn(true); await refreshAll(); toast("Logged in");
  }catch(e){ toast(e.message); }
}
async function logout(){
  await sb.auth.signOut(); state.user=null; setLoggedIn(false); toast("Logged out");
}

async function refreshAll(){
  await Promise.all([loadIssuers(), loadClients(), loadInvoices()]);
  buildSelects(); buildBackendLists(); buildItems(); renderHistory(); render();
}
async function loadIssuers(){
  const { data, error } = await sb.from('invoice_issuers').select('*').order('created_at', {ascending:true});
  if(error) throwError(error); state.issuers=data||[];
  if(!state.current.issuer && state.issuers[0]) state.current.issuer=state.issuers[0].id;
}
async function loadClients(){
  const { data, error } = await sb.from('invoice_clients').select('*').order('created_at', {ascending:true});
  if(error) throwError(error); state.clients=data||[];
  if(!state.current.client && state.clients[0]) state.current.client=state.clients[0].id;
}
async function loadInvoices(){
  const { data, error } = await sb.from('invoice_records').select('*').order('created_at', {ascending:false}).limit(200);
  if(error) throwError(error); state.invoices=data||[];
}
function throwError(error){ console.error(error); toast(error.message || "Supabase error"); }

function switchTab(id){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  [...document.querySelectorAll('.tab')].find(b=>b.textContent.includes(id==='invoice'?'Invoice':id==='history'?'History':'Backend')).classList.add('active');
  document.getElementById(id).classList.add('active');
}
function buildSelects(){
  issuerSelect.innerHTML=state.issuers.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');
  clientSelect.innerHTML=state.clients.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');
  if(state.current.issuer) issuerSelect.value=state.current.issuer;
  if(state.current.client) clientSelect.value=state.current.client;
}
function buildItems(){
  lineItems.innerHTML = state.items.map((it,i)=>`
    <div class="card">
      <label>Description</label><input value="${escapeAttr(it.desc)}" oninput="state.items[${i}].desc=this.value; render();">
      <div class="row"><div><label>Amount RM</label><input type="number" step="0.01" value="${Number(it.amount||0).toFixed(2)}" oninput="state.items[${i}].amount=parseFloat(this.value||0); render();"></div>
      <div style="display:flex;align-items:end"><button class="danger" style="width:100%" onclick="removeItem(${i})">Remove</button></div></div>
    </div>`).join('');
}
function addItem(){ state.items.push({desc:"",amount:0}); buildItems(); render(); }
function removeItem(i){ state.items.splice(i,1); buildItems(); render(); }

async function saveIssuer(){
  try{
    const payload={name:val('bIssuerName'),address:val('bIssuerAddress'),phone:val('bIssuerPhone'),email:val('bIssuerEmail'),note:val('bIssuerNote'),signature:val('bIssuerSig')};
    const id=val('bIssuerId');
    let q = id ? sb.from('invoice_issuers').update(payload).eq('id', id).select().single() : sb.from('invoice_issuers').insert(payload).select().single();
    const { data, error } = await q; if(error) throw error;
    state.current.issuer=data.id; await loadIssuers(); buildSelects(); buildBackendLists(); render(); toast("Issuer saved");
  }catch(e){ toast(e.message); }
}
async function saveClient(){
  try{
    const payload={name:val('bClientName'),address:val('bClientAddress'),attn:val('bClientAttn'),tel:val('bClientTel')};
    const id=val('bClientId');
    let q = id ? sb.from('invoice_clients').update(payload).eq('id', id).select().single() : sb.from('invoice_clients').insert(payload).select().single();
    const { data, error } = await q; if(error) throw error;
    state.current.client=data.id; await loadClients(); buildSelects(); buildBackendLists(); render(); toast("Client saved");
  }catch(e){ toast(e.message); }
}
function buildBackendLists(){
  issuerList.innerHTML=state.issuers.map(x=>`<div class="listItem"><div><b>${escapeHtml(x.name)}</b><br><span>${escapeHtml(x.email||'')}</span></div><button class="smallbtn" onclick="editIssuer('${x.id}')">Edit</button></div>`).join('');
  clientList.innerHTML=state.clients.map(x=>`<div class="listItem"><div><b>${escapeHtml(x.name)}</b><br><span>${escapeHtml(x.attn||'')}</span></div><button class="smallbtn" onclick="editClient('${x.id}')">Edit</button></div>`).join('');
}
function editIssuer(id){
  const x=state.issuers.find(a=>a.id===id); if(!x) return;
  set('bIssuerId',x.id); set('bIssuerName',x.name); set('bIssuerAddress',x.address); set('bIssuerPhone',x.phone); set('bIssuerEmail',x.email); set('bIssuerNote',x.note); set('bIssuerSig',x.signature);
}
function editClient(id){
  const x=state.clients.find(a=>a.id===id); if(!x) return;
  set('bClientId',x.id); set('bClientName',x.name); set('bClientAddress',x.address); set('bClientAttn',x.attn); set('bClientTel',x.tel);
}
function clearIssuerForm(){ ['bIssuerId','bIssuerName','bIssuerAddress','bIssuerPhone','bIssuerEmail','bIssuerNote','bIssuerSig'].forEach(id=>set(id,'')); }
function clearClientForm(){ ['bClientId','bClientName','bClientAddress','bClientAttn','bClientTel'].forEach(id=>set(id,'')); }

function snapshot(){
  const issuer=state.issuers.find(x=>x.id===issuerSelect.value)||{};
  const client=state.clients.find(x=>x.id===clientSelect.value)||{};
  const total=state.items.reduce((s,it)=>s+(parseFloat(it.amount)||0),0);
  return {
    invoice_no:val('invoiceNo'), invoice_date:val('date'), issuer_id:issuer.id, client_id:client.id,
    your_ref:val('yourRef'), do_no:val('doNo'), terms:val('terms'), page_no:val('pageNo'), total,
    issuer, client, items:JSON.parse(JSON.stringify(state.items))
  };
}
async function saveInvoice(){
  try{
    const snap=snapshot();
    if(!snap.issuer_id || !snap.client_id) return toast("Save issuer and client first");
    if(!snap.invoice_no) return toast("Invoice no required");

    const payload={invoice_no:snap.invoice_no, invoice_date:snap.invoice_date, issuer_id:snap.issuer_id, client_id:snap.client_id, your_ref:snap.your_ref, do_no:snap.do_no, terms:snap.terms, page_no:snap.page_no, total:snap.total, snapshot:snap};

    let invoiceId = state.currentInvoiceId;
    let shouldUpdateExisting = false;

    if(invoiceId){
      const existing = state.invoices.find(x => x.id === invoiceId);
      shouldUpdateExisting = existing && String(existing.invoice_no || "") === String(snap.invoice_no || "");
    }

    if(shouldUpdateExisting){
      const { error } = await sb.from('invoice_records').update(payload).eq('id', invoiceId);
      if(error) throw error;
      await sb.from('invoice_items').delete().eq('invoice_id', invoiceId);
    }else{
      const { data, error } = await sb.from('invoice_records').insert(payload).select().single();
      if(error) throw error;
      invoiceId = data.id;
      state.currentInvoiceId = invoiceId;
    }

    const rows=state.items.map((it,i)=>({invoice_id:invoiceId,line_no:i+1,description:it.desc,amount:parseFloat(it.amount)||0}));
    if(rows.length){
      const { error: itemErr } = await sb.from('invoice_items').insert(rows);
      if(itemErr) throw itemErr;
    }

    await loadInvoices(); renderHistory(); toast(shouldUpdateExisting ? "Invoice updated" : "New invoice saved");
  }catch(e){ toast(e.message); }
}
function renderHistory(){
  const q=(val('historySearch')||'').toLowerCase();
  let arr=state.invoices.filter(x=>{
    const snap=x.snapshot||{};
    return !q || String(x.invoice_no||'').toLowerCase().includes(q) || String(snap.client?.name||'').toLowerCase().includes(q);
  });

  const totalPages = Math.max(1, Math.ceil(arr.length / state.historyPageSize));
  if(state.historyPage > totalPages) state.historyPage = totalPages;
  if(state.historyPage < 1) state.historyPage = 1;

  const start = (state.historyPage - 1) * state.historyPageSize;
  const pageItems = arr.slice(start, start + state.historyPageSize);

  historyList.innerHTML=pageItems.map(x=>{
    const snap=x.snapshot||{};
    return `<div class="history-card">
      <div class="history-head">
        <div>
          <div class="history-no">${escapeHtml(x.invoice_no)}</div>
          <div class="history-client">${escapeHtml(snap.client?.name||'')}</div>
        </div>
        <div class="history-total">
          <strong>RM ${money(x.total)}</strong>
          <span>${escapeHtml(x.invoice_date||'')}</span>
        </div>
      </div>
      <div class="history-actions">
        <button class="smallbtn" onclick="loadInvoice('${x.id}')">Load</button>
        <button class="smallbtn" onclick="duplicateInvoice('${x.id}')">Duplicate</button>
        <button class="smallbtn" onclick="deleteInvoice('${x.id}')">Delete</button>
      </div>
    </div>`;
  }).join('') || '<p class="muted">No saved invoices yet.</p>';

  const pageInfo = document.getElementById('historyPageInfo');
  const prevBtn = document.getElementById('historyPrevBtn');
  const nextBtn = document.getElementById('historyNextBtn');

  if(pageInfo){
    const totalItems = arr.length;
    const shownFrom = totalItems ? start + 1 : 0;
    const shownTo = Math.min(start + pageItems.length, totalItems);
    pageInfo.textContent = `Page ${state.historyPage} / ${totalPages} · ${shownFrom}-${shownTo} of ${totalItems}`;
  }
  if(prevBtn) prevBtn.disabled = state.historyPage <= 1;
  if(nextBtn) nextBtn.disabled = state.historyPage >= totalPages;
}

function changeHistoryPage(delta){
  state.historyPage += delta;
  renderHistory();
}
function loadInvoice(id){
  const x=state.invoices.find(a=>a.id===id); if(!x) return;
  const s=x.snapshot||{};
  state.currentInvoiceId=x.id;
  state.current.issuer=s.issuer_id; state.current.client=s.client_id;
  buildSelects();
  set('invoiceNo',s.invoice_no); set('date',s.invoice_date); set('yourRef',s.your_ref); set('doNo',s.do_no); set('terms',s.terms); set('pageNo',s.page_no);
  state.items=s.items||[]; buildItems(); render(); switchTab('invoice'); toast("Loaded for reprint");
}
function duplicateInvoice(id){
  loadInvoice(id); state.currentInvoiceId=null; set('invoiceNo', val('invoiceNo') + "-COPY"); render(); toast("Duplicated. Change invoice no.");
}
async function deleteInvoice(id){
  const ok = await openConfirm("Delete this saved invoice?", "Delete Invoice");
  if(!ok) return;
  const { error } = await sb.from('invoice_records').delete().eq('id',id); if(error) return toast(error.message);
  if(state.currentInvoiceId===id) state.currentInvoiceId=null;
  await loadInvoices(); renderHistory(); toast("Deleted");
}
function newInvoice(){
  state.currentInvoiceId=null; set('invoiceNo',''); set('date',today()); set('yourRef',''); set('doNo',''); set('terms','C.O.D'); set('pageNo','1 of 1');
  state.items=[{desc:"",amount:0}]; buildItems(); render(); toast("New invoice");
}

function render(){
  state.current.issuer=issuerSelect?.value||state.current.issuer;
  state.current.client=clientSelect?.value||state.current.client;
  const issuer=state.issuers.find(x=>x.id===state.current.issuer)||{};
  const client=state.clients.find(x=>x.id===state.current.client)||{};
  companyBlock.innerHTML = `${escapeHtml(issuer.name||'')}<br>${escapeHtml(issuer.address||'')}<br>Phone: ${escapeHtml(issuer.phone||'')} Email: ${escapeHtml(issuer.email||'')}`;
  invoiceTitle.textContent = `INVOICE : ${val('invoiceNo')}`;
  clientBlock.innerHTML = `<div class="client-name">${escapeHtml(client.name||'')}</div><div class="client-address">${nl(client.address||'')}</div><div class="contact-box"><div class="contact-attn">Attn : ${escapeHtml(client.attn||'')}</div><div class="contact-line">TEL : ${escapeHtml(client.tel||'')}</div></div>`;
  metaBlock.innerHTML = [["Your Ref.",val('yourRef')],["Our D/O No",val('doNo')],["Terms",val('terms')],["Date",formatDate(val('date'))],["Page",val('pageNo')]].map(r=>`<div class="meta-row"><b>${r[0]}</b><b>:</b><b>${escapeHtml(r[1])}</b></div>`).join('');
  itemsBody.innerHTML = state.items.map((it,i)=>`<tr><td class="no">${i+1}</td><td class="desc">${escapeHtml(it.desc)}</td><td class="amount">${money(it.amount)}</td></tr>`).join('');
  const total=state.items.reduce((s,it)=>s+(parseFloat(it.amount)||0),0);
  amountWords.textContent = `RINGGIT MALAYSIA : ${amountToWords(total).toUpperCase()} ONLY`;
  totalAmount.textContent = money(total);
  notesBlock.innerHTML = `<div>Notes :</div><div>1. ${nl(issuer.note||'')}</div>`;
  signatureName.textContent = issuer.signature||'';
}

function val(id){return document.getElementById(id)?.value || ""}
function set(id,v){const el=document.getElementById(id); if(el) el.value=v||""}
function escapeHtml(str){return String(str||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escapeAttr(str){return escapeHtml(str).replace(/"/g,'&quot;')}
function nl(str){return escapeHtml(str).replace(/\n/g,'<br>')}
function formatDate(s){if(!s)return"";const d=new Date(s+"T00:00:00");return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
function money(n){return (parseFloat(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
const ones=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const tens=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function wordsUnder1000(n){let out=[];if(n>=100){out.push(ones[Math.floor(n/100)]+" hundred");n%=100}if(n>=20){out.push(tens[Math.floor(n/10)]);n%=10}if(n>0)out.push(ones[n]);return out.join(" ")}
function numWords(n){if(n===0)return"zero";let parts=[];for(const [v,name] of [[1000000,"million"],[1000,"thousand"]]){if(n>=v){parts.push(wordsUnder1000(Math.floor(n/v))+" "+name);n%=v}}if(n>0)parts.push(wordsUnder1000(n));return parts.join(" ")}
function amountToWords(amount){const r=Math.floor(amount);const c=Math.round((amount-r)*100);let text=numWords(r);if(c>0)text+=" and cents "+numWords(c);return text}
function toast(msg="Saved"){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}


let confirmResolver = null;

function openConfirm(message, title="Confirm"){
  const modal = document.getElementById('confirmModal');
  const titleEl = document.getElementById('confirmModalTitle');
  const msgEl = document.getElementById('confirmModalMessage');
  titleEl.textContent = title;
  msgEl.textContent = message;
  modal.classList.add('show');
  return new Promise(resolve => {
    confirmResolver = resolve;
  });
}

function closeConfirm(result){
  const modal = document.getElementById('confirmModal');
  modal.classList.remove('show');
  if(confirmResolver){
    confirmResolver(result);
    confirmResolver = null;
  }
}

init();
</script>
